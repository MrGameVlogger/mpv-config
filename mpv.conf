# MPV Configuration
# MrGameVlogger - 2026-09-05
# https://github.com/MrGameVlogger/mpv-config

# This configuration uses vo=gpu-next (libplacebo-based renderer)
# On macOS, gpu-api=vulkan via MoltenVK is required.
# Tested on MacBook Pro M2 Max (Mac14,6), 64GB RAM, 3456x2234 Retina @ 120Hz
# mpv v0.41.0_9, libplacebo v7.360.1, FFmpeg 9.0.1, MoltenVK 1.4.2

##############################################################################
# SELF-SERVICE CONFIGURATION                                                 #
# These are the settings most likely to need adjustment for your setup.      #
# Everything else is generally safe to leave at defaults.                    #
##############################################################################

# --- GPU API ---
gpu-api=vulkan # Required for vo=gpu-next on macOS via MoltenVK
gpu-context=macvk # macOS-specific Vulkan context

# --- Hardware Decoding ---
hwdec=auto-copy # Auto-select best HW decoder, copy frames to CPU for script compatibility (thumbfast Trickplay needs CPU-side frames)
hwdec-codecs=all # Enable hardware decoding for all codecs
hwdec-threads=4 # Dedicated threads for VideoToolbox copy-back path
vd-lavc-threads=0 # Auto-detect decoder thread count

# --- Display Geometry ---
fullscreen=yes # Start in fullscreen
geometry=50%:50% # Center window (unused when fullscreen)
autofit=100% # Fill screen (unused when fullscreen)
no-hidpi-window-scale # Don't auto-scale on Retina displays

# --- Subtitle Font ---
sub-font="Gandhi Sans"
sub-font-size=50

###########
# General #
###########

vo=gpu-next # libplacebo-based renderer (default since mpv 0.41)
vulkan-async-transfer=yes # Async texture uploads through MoltenVK
vulkan-async-compute=yes # Async compute shaders
profile=high-quality # Sets ewa_lanczossharp scaling, sigmoid upscaling, etc.
video-latency-hacks=yes # Reduces latency (safe without display-sync)

######
# UI #
######

window-maximized=no # Not maximized (unused when fullscreen)
osc=no # Disabled because jf-mpv-osc handles the OSC
border=no # Borderless window
cursor-autohide=1000 # Hide cursor after 1 second
force-window=immediate # Open window immediately on launch
macos-fs-animation-duration=0 # Disable macOS fullscreen animation

############
# Playback #
############

keep-open=yes # Don't close window after playback ends
save-position-on-quit=yes # Resume from last position
save-watch-history=yes # Track watch history
autocreate-playlist=same # Auto-add files from same directory
video-sync=audio # Audio-driven sync (display-sync broken on MoltenVK)
interpolation=no # Disabled — anime is intentionally 24fps, interpolation creates artifacts and loses aesthetic
swapchain-depth=4 # Extra presentation buffer headroom
hr-seek=absolute # Precise seeking
reset-on-next-file=audio-delay,mute,pause,speed,sub-delay # Reset these between files

##############
# Colorspace #
##############

target-prim=auto # Auto-detect display color primaries
target-trc=auto # Auto-detect display transfer function
video-output-levels=full # Full range output for accurate colors

##########
# Dither #
##########

dither-depth=auto # Match display bit depth
temporal-dither=yes # Temporal dithering for smoother gradients
dither=fruit # Higher quality dithering algorithm

#############
# Debanding #
#############

deband=no # Off by default, toggle with 'n' key at runtime
deband-iterations=4 # Number of passes (1-4). Higher = stronger but more GPU cost
deband-range=24 # How far the filter samples (1-64)
deband-grain=16 # Adds dynamic noise to mask residual banding

###############################################################################
# Upscaling & Downscaling — Fallback Scalers                                  #
#                                                                             #
# scale= and dscale= are active in vo=gpu-next/libplacebo and serve as        #
# fallbacks when no GLSL shader handles the scaling step, including:          #
#   - Content that doesn't match any profile (unusual resolutions)            #
#   - The final RGB output pass after shaders have run                        #
###############################################################################

scale=ewa_lanczos # High quality polar (Jinc) luma upscale fallback
dscale=catmull_rom # Good quality luma downscale
correct-downscaling=yes # Proper windowed filter for large ratio downscaling
linear-downscaling=yes # Downscale in linear light (more correct for luminance blending)
sigmoid-upscaling=yes # Sigmoid curve during upscaling to reduce ringing
scale-antiring=0.6 # Anti-ringing on fallback scaler

###############################################################################
# Upscaling Logic — Per-Resolution Profiles                                   #
#                                                                             #
# One shader strategy is used for all upscaling:                              #
#                                                                             #
# ravu-zoom-ar-r3 — arbitrary-ratio luma upscaler (fractional, one pass)     #
#    - Handles any scale factor (720p→4K, 1080p→4K, etc.)                    #
#    - Used in 1080p-1440p and Sub-1080p profiles                             #
#                                                                             #
# ArtCNN_C4F16 is available via Ctrl+g keybind (not in auto-profiles)        #
#    - Better for exact 2x upscaling (1080p→4K)                              #
#    - Toggle with Ctrl+g to swap RAVU for ArtCNN                            #
#                                                                             #
# Chroma: all YUV 4:2:0 content needs chroma upscaling regardless of luma.  #
# CfL_Prediction infers chroma from luma correlation — the best available    #
# real-time chroma upscaler.                                                  #
#                                                                             #
# MPV shader processing order:                                                #
#   1. Luma shaders (ravu-zoom)                                              #
#   2. Chroma shaders (CfL_Prediction)                                       #
#   3. Chroma scaled to luma size                                             #
#   4. Both converted to RGB                                                  #
#   5. Main scaler (scale=) applied for final output resolution               #
###############################################################################

#########
# Audio #
#########

ao=coreaudio # macOS audio output
volume-max=200 # Allow volume above 100%

#############
# Subtitles #
#############

embeddedfonts=yes # Use fonts embedded in video files
sub-fix-timing=no # Don't fix subtitle timing (default)
blend-subtitles=yes # CPU-side subtitle compositing (not =video which is GPU-heavy)
demuxer-mkv-subtitle-preroll=index # Improved subtitle preroll for MKV files
subs-with-matching-audio=no # Don't auto-select subs matching audio language
sub-gauss=1.0 # Slight subtitle blur for readability
sub-ass-override=no # Don't override ASS subtitle styling
sub-ass-style-overrides=playresx=1920,playresy=1080,Kerning=yes # Affects non-ASS subs only (SRT, etc.)
sub-color="#FFFFFF" # White subtitle color
sub-margin-y=40 # Vertical margin from bottom
sub-border-size=2.4 # Border thickness
sub-border-color="#FF000000" # Black border
sub-shadow-color="#A0000000" # Semi-transparent black shadow
sub-shadow-offset=0.75 # Shadow distance
sub-bold=yes # Bold text

###########
# Languages #
###########

# Subtitle priority: enm before eng for honorifics in fansubs
slang=enm,eng,en
alang=ja,jp,jpn

# Dub (commented out — switch manually when needed)
#slang=zxx,eng,en
#alang=eng,en
#subs-with-matching-audio=forced

########
# yt-dlp #
########

# Prefer HEVC 4K (HW decode) → VP9 4K (HW decode) → AV1 1080p (SW decode) → best
ytdl-format="bestvideo[vcodec^=hev1][height>=2160]+bestaudio/bestvideo[vcodec^=vp9][height>=2160]+bestaudio/bestvideo[vcodec^=av01][height<=1080]+bestaudio/bestvideo[height<=1080]+bestaudio/best"
#ytdl-raw-options-append=cookies-from-browser=safari # Uncomment for cookie-based auth
ytdl-raw-options-append=external-downloader=aria2c # Faster downloads with aria2c

##############
# Screenshots #
##############

screenshot-format=png # PNG format for lossless screenshots
screenshot-dir="~/Pictures/mpv" # Save location
screenshot-template="%F-%p-%n" # Filename: title-position-number
screenshot-high-bit-depth=yes # Preserve HDR color depth

##########
# Cache #
##########

cache=yes # Enable demuxer cache
cache-on-disk=no # Don't cache to disk
demuxer-max-bytes=8192M # Large cache for Jellyfin streaming over network
demuxer-max-back-bytes=2048M # Large rewinding buffer
demuxer-readahead-secs=90 # Aggressive readahead for streaming
demuxer-hysteresis-secs=10 # Cache hysteresis threshold
cache-pause=no # Don't pause when buffer is empty

##########
# Logging #
##########

log-file=~~/mpv.log # Log file location (overwritten each session)

############
# Profiles #
############

[HDR]

profile-desc=HDR content (PQ/HLG gamma)
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
tone-mapping=bt.2446a # Perceptual tone mapping for HDR on SDR display
hdr-compute-peak=yes # Real-time per-scene HDR peak brightness measurement
target-peak=500 # Tuned for SDR display peak brightness
gamut-mapping-mode=perceptual # Perceptual gamut mapping
target-colorspace-hint=yes # Signal display's native colorspace for HDR passthrough

[4K]

profile-desc=4K content (height >= 2160)
profile-cond=height and height >= 2160
profile-restore=copy
glsl-shader="~~/shaders/CfL_Prediction.glsl" # Chroma from luma prediction
glsl-shader="~~/shaders/SSimSuperRes.glsl" # Anti-ringing

[1080p-1440p]

profile-desc=1080p-1440p content
profile-cond=height and height >= 1080 and height < 2160
profile-restore=copy
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook" # Arbitrary ratio upscaling
glsl-shader="~~/shaders/CfL_Prediction.glsl" # Chroma from luma prediction
glsl-shader="~~/shaders/SSimSuperRes.glsl" # Anti-ringing

[Sub-1080p]

profile-desc=Sub-1080p content (height < 1080)
profile-cond=height and height < 1080
profile-restore=copy
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook" # Arbitrary ratio upscaling
glsl-shader="~~/shaders/CfL_Prediction.glsl" # Chroma from luma prediction
glsl-shader="~~/shaders/SSimSuperRes.glsl" # Anti-ringing

[interlaced]

profile-desc=Interlaced content (older anime, DVDs)
profile-cond=p["video-frame-info/interlaced"]
profile-restore=copy
deinterlace=yes # BWDIF (motion-adaptive) deinterlacing

[protocol.http]

profile-desc=HTTP streams
hls-bitrate=max # Use max quality for HLS streams
cache=yes

[protocol.https]

profile=protocol.http

[protocol.ytdl]

profile=protocol.http
