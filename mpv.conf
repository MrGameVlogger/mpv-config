# MPV Configuration
# MrGameVlogger - 2026-09-05
# https://github.com/MrGameVlogger/mpv-config

# This configuration uses vo=gpu-next (libplacebo-based renderer)
# On macOS, gpu-api=vulkan via MoltenVK is required.
# Tested on MacBook Pro M2 Max (Mac14,6), 64GB RAM, 3456x2234 Retina @ 120Hz
# mpv v0.41.0_9, libplacebo v7.360.1, FFmpeg 9.0.1, MoltenVK 1.4.2

##############################################################################
# SELF-SERVICE CONFIGURATION                                                 #
# These are the settings most likely to need adjustment for your setup.      #
# Everything else is generally safe to leave at defaults.                    #
##############################################################################

# --- GPU API ---
gpu-api=vulkan
gpu-context=macvk

# --- Hardware Decoding ---
hwdec=auto-copy
hwdec-codecs=all
hwdec-threads=4
vd-lavc-threads=0

# --- Display Geometry ---
fullscreen=yes
geometry=50%:50%
autofit=100%
no-hidpi-window-scale

# --- Subtitle Font ---
sub-font="Gandhi Sans"
sub-font-size=50

###########
# General #
###########

vo=gpu-next
vulkan-async-transfer=yes
vulkan-async-compute=yes
profile=high-quality
video-latency-hacks=yes

######
# UI #
######

window-maximized=no
osc=no
border=no
cursor-autohide=1000
force-window=immediate
macos-fs-animation-duration=0

############
# Playback #
############

keep-open=yes
save-position-on-quit=yes
save-watch-history=yes
autocreate-playlist=same
video-sync=audio
interpolation=no
swapchain-depth=4
hr-seek=absolute
reset-on-next-file=audio-delay,mute,pause,speed,sub-delay

##############
# Colorspace #
##############

target-prim=auto
target-trc=auto
video-output-levels=full

##########
# Dither #
##########

dither-depth=auto
temporal-dither=yes
dither=fruit

#############
# Debanding #
#############

deband=no
deband-iterations=4
deband-range=24
deband-grain=16

###############################################################################
# Upscaling & Downscaling — Fallback Scalers                                  #
#                                                                             #
# scale= and dscale= are active in vo=gpu-next/libplacebo and serve as        #
# fallbacks when no GLSL shader handles the scaling step, including:          #
#   - Content that doesn't match any profile (unusual resolutions)            #
#   - The final RGB output pass after shaders have run                        #
###############################################################################

scale=ewa_lanczos
dscale=catmull_rom
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
scale-antiring=0.6

###############################################################################
# Anti-Ringing                                                                #
###############################################################################

###############################################################################
# Upscaling Logic — Per-Resolution Profiles                                   #
#                                                                             #
# Two shader strategies are used:                                             #
#                                                                             #
# 1. ArtCNN_C4F16 — fixed 2x luma doubler (CNN-based, real-time)             #
#    - Use when source is exactly half the display height                     #
#    - e.g. 1080p → 4K (1080 * 2 = 2160): single clean 2x pass              #
#                                                                             #
# 2. ravu-zoom-ar-r3 — arbitrary-ratio luma upscaler (fractional, one pass)  #
#    - Use when source height * 2 ≠ display height (non-2x scale factor)     #
#    - e.g. 720p → 4K (720 * 2 = 1440, not 2160): ravu-zoom scales           #
#      directly from 720p to 4K in a single pass                             #
#                                                                             #
# Chroma: all YUV 4:2:0 content needs chroma upscaling regardless of luma.  #
# CfL_Prediction infers chroma from luma correlation — the best available    #
# real-time chroma upscaler.                                                  #
#                                                                             #
# MPV shader processing order:                                                #
#   1. Luma shaders (ArtCNN or ravu-zoom)                                    #
#   2. Chroma shaders (CfL_Prediction)                                       #
#   3. Chroma scaled to luma size                                             #
#   4. Both converted to RGB                                                  #
#   5. Main scaler (scale=) applied for final output resolution               #
###############################################################################

#########
# Audio #
#########

ao=coreaudio
volume-max=200

############
# Subtitles #
############

embeddedfonts=yes
sub-fix-timing=no
blend-subtitles=yes
demuxer-mkv-subtitle-preroll=index
subs-with-matching-audio=no
sub-gauss=1.0
sub-ass-override=no
sub-ass-style-overrides=playresx=1920,playresy=1080,Kerning=yes
sub-color="#FFFFFF"
sub-margin-y=40
sub-border-size=2.4
sub-border-color="#FF000000"
sub-shadow-color="#A0000000"
sub-shadow-offset=0.75
sub-bold=yes

###########
# Languages #
###########

# Subtitle priority: enm before eng for honorifics
slang=enm,eng,en
alang=ja,jp,jpn

# Dub (commented out)
#slang=zxx,eng,en
#alang=eng,en
#subs-with-matching-audio=forced

########
# yt-dlp #
########

# Prefer HEVC 4K (HW decode) → VP9 4K (HW decode) → AV1 1080p (SW decode) → best
ytdl-format="bestvideo[vcodec^=hev1][height>=2160]+bestaudio/bestvideo[vcodec^=vp9][height>=2160]+bestaudio/bestvideo[vcodec^=av01][height<=1080]+bestaudio/bestvideo[height<=1080]+bestaudio/best"
#ytdl-raw-options-append=cookies-from-browser=safari
ytdl-raw-options-append=external-downloader=aria2c

##############
# Screenshots #
##############

screenshot-format=png
screenshot-dir="~/Pictures/mpv"
screenshot-template="%F-%p-%n"
screenshot-high-bit-depth=yes

##########
# Cache #
##########

cache=yes
cache-on-disk=no
demuxer-max-bytes=8192M
demuxer-max-back-bytes=2048M
demuxer-readahead-secs=90
demuxer-hysteresis-secs=10
cache-pause=no

##########
# Logging #
##########

log-file=~~/mpv.log

############
# Profiles #
############

[HDR]

profile-desc=HDR content (PQ/HLG gamma)
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
tone-mapping=bt.2446a
hdr-compute-peak=yes
target-peak=500
gamut-mapping-mode=perceptual
target-colorspace-hint=yes

[4K]

profile-desc=4K content (height >= 2160)
profile-cond=height and height >= 2160
profile-restore=copy
glsl-shader="~~/shaders/CfL_Prediction.glsl"
glsl-shader="~~/shaders/SSimSuperRes.glsl"

[1080p-1440p]

profile-desc=1080p-1440p content
profile-cond=height and height >= 1080 and height < 2160
profile-restore=copy
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
glsl-shader="~~/shaders/SSimSuperRes.glsl"

[Sub-1080p]

profile-desc=Sub-1080p content (height < 1080)
profile-cond=height and height < 1080
profile-restore=copy
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
glsl-shader="~~/shaders/SSimSuperRes.glsl"

[interlaced]

profile-desc=Interlaced content (older anime, DVDs)
profile-cond=p["video-frame-info/interlaced"]
profile-restore=copy
deinterlace=yes

[protocol.http]

profile-desc=HTTP streams
hls-bitrate=max
cache=yes

[protocol.https]

profile=protocol.http

[protocol.ytdl]

profile=protocol.http
