# Socket path (leave empty for auto)
socket=

# Thumbnail path (leave empty for auto)
thumbnail=

# Maximum thumbnail generation size in pixels (scaled down to fit)
# Values are scaled when hidpi is enabled
max_height=180
max_width=320

# Scale factor for thumbnail display size (requires mpv 0.38+)
# Note that this is lower quality than increasing max_height and max_width
scale_factor=1

# Apply tone-mapping, no to disable
tone_mapping=auto

# Overlay id
overlay_id=42

# Spawn thumbnailer on file load for faster initial thumbnails
spawn_first=yes

# Close thumbnailer process after an inactivity period in seconds, 0 to disable
quit_after_inactivity=0

# Enable on network playback
network=yes

# Enable on audio playback
audio=no

# Enable hardware decoding
hwdec=yes

# Windows only: use native Windows API to write to pipe (requires LuaJIT)
direct_io=no

# Custom path to the mpv executable
mpv_path=mpv

# Cache limit in MB for downloaded Trickplay strips (oldest evicted first)
# A two-hour movie is roughly 250MB at 320x180
cache_max_mb=2048

# Verify TLS certificates for Jellyfin API and tile requests (curl), and for
# the fallback thumbnail worker. Set to no for self-signed certificates.
# Note: since mpv 0.42, stream playback itself also verifies TLS by default;
# add --tls-verify=no to mpv.conf for self-signed servers.
tls_verify=yes

# Path to a custom CA certificate (or bundle) to trust instead of disabling
# verification. Alternative to tls_verify=no. Paths are expanded (~~/ etc.).
cacert=
